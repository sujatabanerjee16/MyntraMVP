<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MVP shopper walkthrough</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { --pink: #ff3f6c; --ink: #282c3f; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        font-family: Assistant, "Segoe UI", sans-serif;
        background: #07080d;
        color: #fff;
      }
      .wrap {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 10px 16px;
      }
      .meta {
        flex: 0 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 8px;
      }
      .kicker {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #ff8aa8;
        font-weight: 800;
      }
      h1 { margin: 2px 0 0; font-size: 18px; font-weight: 800; }
      .clock { color: #9aa0b4; font-size: 13px; font-weight: 700; white-space: nowrap; }
      .player {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
        background: #000;
        border: 1px solid #2a2d3d;
        border-radius: 14px;
        overflow: hidden;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      .caption {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 12px;
        z-index: 2;
        background: rgba(17, 24, 39, 0.92);
        border-radius: 12px;
        padding: 10px 14px;
        pointer-events: none;
      }
      .caption .step {
        margin: 0 0 2px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ff8aa8;
      }
      .caption p { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3; }
      .ctrl {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 12px;
        background: linear-gradient(180deg, transparent, rgba(7, 8, 13, 0.9) 40%);
      }
      button {
        border: 0;
        font: 800 12px Assistant, sans-serif;
        padding: 7px 12px;
        border-radius: 999px;
        cursor: pointer;
      }
      #play { background: #fff; color: var(--ink); }
      .ghost {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.28);
      }
      .bar {
        flex: 1;
        height: 6px;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 99px;
        overflow: hidden;
        cursor: pointer;
      }
      .fill { height: 100%; width: 0; background: var(--pink); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="meta">
        <div>
          <p class="kicker">Recorded shopper session</p>
          <h1>MVP · what the shopper is doing</h1>
        </div>
        <div class="clock" id="clock">0:00 / 0:00</div>
      </div>
      <div class="player">
        <video id="vid" src="/shopper-experience.webm" autoplay muted playsinline></video>
        <div class="caption">
          <p class="step" id="step">Home</p>
          <p id="line">Browsing Myntra like a shopper.</p>
        </div>
        <div class="ctrl">
          <button type="button" class="ghost" id="back">Back 5s</button>
          <button type="button" id="play">Pause</button>
          <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
          <button type="button" class="ghost" id="restart">Replay</button>
        </div>
      </div>
    </div>
    <script>
      const chapters = [
        { t: 0, step: "Home", line: "Browsing Women — Men, Kids, Beauty, and GenZ sit in the bar." },
        { t: 9.6, step: "Size chart", line: "Apparel listings have a size chart. Sarees and accessories skip it." },
        { t: 14.8, step: "Save to wishlist", line: "Heart tap to save — not Add to Bag." },
        { t: 16.4, step: "Why are you saving this?", line: "Four reasons at the heart tap: Check quality first, Check the fit, Compare, or Upcoming Occasion. Skip is allowed." },
        { t: 18.2, step: "Compare", line: "Choosing Compare — same-type saves sit side by side later." },
        { t: 20.9, step: "View in wishlist", line: "After the heart, a button takes you to that save." },
        { t: 23.5, step: "Wishlist tabs", line: "All · Compare · Quality & trust · My size · Occasion · No longer available — filtered by Women." },
        { t: 26.5, step: "Quality & trust", line: "Fabric, customer stars, N reviews, quality comments, and two real photos." },
        { t: 29.7, step: "My size", line: "Fit from past buys — a sentence, not a stock watch." },
        { t: 32.9, step: "Occasion", line: "When will you wear it — named occasion, optional date, countdown." },
        { t: 41.9, step: "Compare dresses", line: "Same-type dresses: price, stars, a quality note, Lowest here, and Buy this." },
        { t: 50, step: "Category filter", line: "MEN · WOMEN · KIDS · BEAUTY · GENZ — the list never mixes categories." },
        { t: 55, step: "Shop as", line: "Three shoppers on home — Sujata, Priya, Kabir." },
        { t: 58.3, step: "Bag", line: "Moving a saved dress to bag — recs stay on this page." },
        { t: 64.6, step: "Checkout", line: "Place order opens address and UPI or COD — then Pay." },
        { t: 69.6, step: "Order", line: "Pay completes the order." },
      ];

      const vid = document.getElementById("vid");
      const playBtn = document.getElementById("play");
      const fill = document.getElementById("fill");
      const bar = document.getElementById("bar");
      const clock = document.getElementById("clock");
      const stepEl = document.getElementById("step");
      const lineEl = document.getElementById("line");

      function fmt(s) {
        s = Math.max(0, Math.floor(s || 0));
        return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      }
      function captionFor(t) {
        let row = chapters[0];
        for (const ch of chapters) {
          if (t >= ch.t) row = ch;
        }
        return row;
      }
      function paint() {
        const d = vid.duration || 0;
        const t = vid.currentTime || 0;
        fill.style.width = d ? (t / d) * 100 + "%" : "0%";
        clock.textContent = fmt(t) + " / " + fmt(d);
        const row = captionFor(t);
        stepEl.textContent = row.step;
        lineEl.textContent = row.line;
        playBtn.textContent = vid.paused ? "Play" : "Pause";
      }
      vid.addEventListener("timeupdate", paint);
      vid.addEventListener("loadedmetadata", paint);
      vid.addEventListener("play", paint);
      vid.addEventListener("pause", paint);
      vid.addEventListener("ended", () => {
        playBtn.textContent = "Play";
      });
      playBtn.onclick = () => {
        if (vid.ended) {
          vid.currentTime = 0;
          vid.play();
        } else if (vid.paused) vid.play();
        else vid.pause();
      };
      document.getElementById("restart").onclick = () => {
        vid.currentTime = 0;
        vid.play();
      };
      document.getElementById("back").onclick = () => {
        vid.currentTime = Math.max(0, vid.currentTime - 5);
      };
      bar.onclick = (event) => {
        const rect = bar.getBoundingClientRect();
        const d = vid.duration || 0;
        vid.currentTime = ((event.clientX - rect.left) / rect.width) * d;
      };
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          playBtn.click();
        }
        if (e.code === "ArrowRight") vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 5);
        if (e.code === "ArrowLeft") vid.currentTime = Math.max(0, vid.currentTime - 5);
      });
    </script>
  </body>
</html>
