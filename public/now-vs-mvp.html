<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Myntra today vs this MVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff3f6c;
        --ink: #282c3f;
        --muted: #7e818c;
        --line: #eaeaec;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        font-family: Assistant, "Segoe UI", sans-serif;
        background: #07080d;
        color: #fff;
      }
      .wrap {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 16px 10px;
      }
      .meta {
        width: min(1160px, 100%);
        flex: 0 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 8px;
      }
      .kicker {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #ff8aa8;
        font-weight: 800;
      }
      .title { margin: 2px 0 0; font-size: 18px; font-weight: 800; }
      .now-playing { margin: 2px 0 0; color: #9aa0b4; font-size: 12px; font-weight: 600; }
      .clock { color: #9aa0b4; font-size: 13px; font-weight: 700; white-space: nowrap; }
      .screen {
        width: min(1160px, 100%);
        flex: 1 1 auto;
        min-height: 0;
        background: #12141c;
        border: 1px solid #2a2d3d;
        border-radius: 14px;
        overflow: hidden;
        position: relative;
      }
      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: scale(1.015);
        transition: opacity 0.4s ease, transform 0.4s ease;
        pointer-events: none;
      }
      .slide.on { opacity: 1; transform: none; pointer-events: auto; }
      .full {
        height: 100%;
        padding: 0 0 56px;
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        align-items: stretch;
        background: #161018;
      }
      .full-copy {
        padding: 40px 48px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .full-photo {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        padding: 20px 20px 16px 0;
        box-sizing: border-box;
        background: #9b1c24;
      }
      .full.end { background: #0e1a1c; }
      .full.end .full-photo { background: #1a6b6e; }
      .full h2 { margin: 0 0 12px; font-size: 36px; line-height: 1.15; max-width: 560px; }
      .full p { margin: 0; color: #d5d8e4; font-size: 18px; line-height: 1.4; max-width: 520px; }
      .versus {
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .col {
        padding: 18px 22px 64px;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .col.now { background: #ececef; color: var(--ink); }
      .col.mvp { background: #fff; color: var(--ink); }
      .tag {
        margin: 0 0 6px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .now .tag { color: var(--muted); }
      .mvp .tag { color: var(--pink); }
      .col h2 { margin: 0 0 6px; font-size: 22px; line-height: 1.2; }
      .col p { margin: 0; color: #5a5d6b; font-size: 14px; line-height: 1.4; }
      .stage {
        margin-top: 12px;
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        min-height: 0;
      }
      .device {
        width: min(248px, 100%);
        height: 100%;
        max-height: 100%;
        background: #111;
        border-radius: 24px;
        padding: 8px;
        box-shadow: 0 16px 32px rgba(0,0,0,0.18);
        display: flex;
        flex-direction: column;
      }
      .device-in {
        background: #f6f6f7;
        border-radius: 18px;
        overflow: hidden;
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .pdp-shot { display: block; width: 100%; height: 132px; object-fit: cover; object-position: center 18%; }
      .pdp-body { padding: 8px 10px 10px; background: #fff; }
      .brand { color: var(--muted); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; }
      .pdp-title { font-size: 13px; font-weight: 800; margin: 2px 0 0; }
      .pdp-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
      }
      .price { font-size: 13px; font-weight: 800; }
      .heart {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: #fff;
        display: grid;
        place-items: center;
        font-size: 16px;
        color: #c8c8ce;
      }
      .heart.on { color: var(--pink); border-color: #ffd0dc; background: #fff0f4; }
      .slide.on .tap .heart { animation: tap 0.5s 0.25s ease both; }
      .slide.on .tap .heart.on { animation: tap 0.5s 0.25s ease both, fill 0.16s 0.45s ease both; }
      .badge {
        display: inline-block;
        margin-top: 6px;
        font-size: 10px;
        font-weight: 800;
        background: #fff3b0;
        color: #6b4e00;
        padding: 3px 7px;
        border-radius: 3px;
      }
      .silent {
        margin-top: 8px;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        background: #f3f3f5;
        border-radius: 8px;
        padding: 7px 8px;
      }
      .sheet-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        border-radius: 14px 14px 0 0;
        padding: 10px 10px 12px;
        box-shadow: 0 -8px 24px rgba(0,0,0,0.12);
      }
      .slide.on .rise { animation: rise 0.35s 0.45s ease both; opacity: 0; }
      .handle {
        width: 36px;
        height: 4px;
        border-radius: 99px;
        background: #d8d8dc;
        margin: 0 auto 8px;
      }
      .sheet-panel h3 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 800;
      }
      .opts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .opt {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 8px;
        padding: 6px 7px;
        font-size: 9px;
        font-weight: 700;
        line-height: 1.25;
        text-align: left;
        color: var(--ink);
      }
      .opt span { display: block; font-size: 14px; margin-bottom: 2px; }
      .opt.on {
        border-color: var(--ink);
        background: #f4f4f5;
      }
      .slide.on .pick { animation: pick 0.28s 0.9s ease both; }
      .skip {
        display: block;
        width: 100%;
        margin-top: 8px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }
      .date-box {
        margin-top: 8px;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      .date-box h4 { margin: 0 0 6px; font-size: 12px; }
      .date-pill {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .save-date {
        width: 100%;
        border: 0;
        background: var(--pink);
        color: #fff;
        font-weight: 800;
        font-size: 11px;
        padding: 7px;
        border-radius: 6px;
      }
      .banner {
        margin: 8px;
        background: #111827;
        color: #fff;
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 11px;
        line-height: 1.35;
        box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      }
      .banner b { color: #ff8aa8; display: block; margin-bottom: 2px; }
      .slide.on .drop { animation: drop 0.3s 0.18s ease both; opacity: 0; }
      .list-row {
        display: flex;
        gap: 8px;
        padding: 8px 10px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        font-weight: 700;
      }
      .list-row img { width: 42px; height: 54px; object-fit: cover; border-radius: 4px; }
      .muted { color: var(--muted); font-weight: 600; }
      .pref {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        font-weight: 700;
      }
      .tog {
        width: 32px;
        height: 18px;
        border-radius: 99px;
        background: #cfcfd4;
        position: relative;
      }
      .tog.on { background: var(--pink); }
      .tog::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
      }
      .tog.on::after { left: 16px; }
      .ctrl {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px 12px;
        background: linear-gradient(180deg, transparent, rgba(7,8,13,0.88) 42%);
      }
      button.ctrl-btn {
        border: 0;
        background: #fff;
        color: var(--ink);
        font: 800 12px Assistant, sans-serif;
        padding: 7px 12px;
        border-radius: 999px;
        cursor: pointer;
      }
      button.ghost {
        background: rgba(255,255,255,0.12);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.28);
      }
      .bar { flex: 1; height: 6px; background: rgba(255,255,255,0.22); border-radius: 99px; overflow: hidden; cursor: pointer; }
      .fill { height: 100%; width: 0; background: var(--pink); }
      .dots { display: flex; gap: 5px; }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.28);
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      .dot.on { background: var(--pink); }
      .hint { display: none; }
      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 4px;
        margin: 6px 0;
        font-size: 8px;
        font-weight: 700;
      }
      .facts span { display: block; color: var(--muted); font-size: 7px; text-transform: uppercase; letter-spacing: 0.06em; }
      .q-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 4px 0; }
      .q-photos img { width: 100%; height: 36px; object-fit: cover; border-radius: 4px; }
      .quote { font-size: 9px; font-weight: 600; color: #5a5d6b; margin: 4px 0 0; }
      .verdict { margin: 6px 0 2px; font-size: 11px; font-weight: 800; }
      .verdict.no { color: #b42318; }
      .tab-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 8px 8px 0;
      }
      .tab-pill {
        font-size: 9px;
        font-weight: 800;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 3px 7px;
        background: #fff;
        color: var(--ink);
      }
      .tab-pill.on { background: var(--pink); border-color: var(--pink); color: #fff; }
      .size-link {
        margin-top: 6px;
        color: var(--pink);
        font-size: 11px;
        font-weight: 800;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .mini-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 9px;
        margin-top: 6px;
      }
      .mini-table th, .mini-table td {
        border: 1px solid var(--line);
        padding: 3px 4px;
        text-align: center;
      }
      .mini-table th { background: #f6f6f8; }
      .rec-box {
        margin: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: #fff;
        font-size: 11px;
        font-weight: 700;
      }
      .rec-box b { display: block; color: var(--pink); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
      .cmp-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 8px;
      }
      .cmp-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px;
        font-size: 9px;
        font-weight: 700;
        line-height: 1.3;
      }
      .cmp-card.is-low { border-color: var(--pink); background: #fff6f8; }
      .cmp-card img { display: block; width: 100%; height: 52px; object-fit: cover; border-radius: 4px; margin-bottom: 4px; }
      .cmp-stars { color: #c98912; font-size: 9px; }
      .cat-bar {
        display: flex;
        gap: 4px;
        padding: 6px 8px 0;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }
      .cat-bar span {
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 2px 6px;
        background: #fff;
      }
      .cat-bar span.on { background: var(--ink); color: #fff; border-color: var(--ink); }
      @keyframes tap {
        0%, 100% { transform: scale(1); }
        35% { transform: scale(0.82); }
      }
      @keyframes fill { to { color: var(--pink); background: #fff0f4; border-color: #ffd0dc; } }
      @keyframes rise {
        from { transform: translateY(110%); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      @keyframes pick {
        from { border-color: var(--line); background: #fff; }
        to { border-color: var(--ink); background: #f4f4f5; }
      }
      @keyframes drop {
        from { transform: translateY(-12px); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      @media (max-width: 820px) {
        .versus { grid-template-columns: 1fr; }
        .full { padding-bottom: 56px; grid-template-columns: 1fr; }
        .full-photo { max-height: 42vh; }
        .col { padding: 16px 16px 68px; }
        .full h2 { font-size: 22px; }
        .dots { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="meta">
        <div>
          <p class="kicker" id="kicker">Feature walkthrough</p>
          <h1 class="title">What Myntra gives you now vs this MVP</h1>
          <p class="now-playing" id="playing"></p>
        </div>
        <div class="clock" id="clock">0:00 / 0:00</div>
      </div>
      <div class="screen" id="screen">
        <div class="ctrl">
          <button type="button" class="ctrl-btn ghost" id="prev">Back</button>
          <button type="button" class="ctrl-btn" id="play">Pause</button>
          <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
          <div class="dots" id="dots"></div>
          <button type="button" class="ctrl-btn ghost" id="restart">Replay</button>
        </div>
      </div>
    </div>
    <script>
      function optsFor(onId) {
        const rows = [
          ["quality", "🔎", "Check quality first"],
          ["size", "📦", "Check the fit"],
          ["compare", "🆚", "Compare"],
          ["occasion", "🎉", "Upcoming Occasion"],
        ];
        return `<div class="opts">${rows
          .map(
            ([id, emoji, label]) =>
              `<div class="opt${id === onId ? " on pick" : ""}"><span>${emoji}</span>${label}</div>`,
          )
          .join("")}</div>`;
      }

      function device(img, body) {
        return `<div class="device"><div class="device-in">${
          img ? `<img class="pdp-shot" src="${img}" alt="" />` : ""
        }${body}</div></div>`;
      }

      function pdp(title, price, heartOn, extra = "", tap = false) {
        return `<div class="pdp-body">
          <div class="brand">Myntra</div>
          <div class="pdp-title">${title}</div>
          <div class="pdp-row${tap ? " tap" : ""}">
            <div class="price">${price}</div>
            <div class="heart${heartOn ? " on" : ""}">${heartOn ? "♥" : "♡"}</div>
          </div>
          ${extra}
        </div>`;
      }

      const slides = [
        {
          t: 4200,
          play: "The split is the heart tap — quality, fit, compare, or occasion.",
          html: `<div class="full">
            <div class="full-copy">
              <h2>Myntra files the save. This MVP asks why you saved.</h2>
              <p>Heart tap → Check quality first, Check the fit, Compare, or Upcoming Occasion. Skip is allowed. Those reasons become tabs that help her decide.</p>
            </div>
            <img class="full-photo" src="/shopper/women-saree.jpg" alt="" />
          </div>`,
        },
        {
          t: 6000,
          play: "Tap wishlist. Today: it just saves. MVP: a sheet asks why.",
          html: `<div class="versus">
            <div class="col now">
              <p class="tag">Myntra now</p>
              <h2>Heart → 1,364 items</h2>
              <p>The piece lands in Wishlist. You can file a Collection later. Nothing is asked at the tap.</p>
              <div class="stage">${device("/shopper/studio-blazer.jpg", pdp("Regular Fit Linen Shirt", "₹1,999", true, `<div class="silent">Saved · Wishlist (1,364)</div>`))}</div>
            </div>
            <div class="col mvp">
              <p class="tag">This MVP</p>
              <h2>Heart → “Saving this for…?”</h2>
              <p>Same tap. Sheet slides up before the save is done. Skip is allowed — no chip.</p>
              <div class="stage">${device("/shopper/studio-blazer.jpg", `
                ${pdp("Regular Fit Linen Shirt", "₹1,999", true, "", true)}
                <div class="sheet-panel rise">
                  <div class="handle"></div>
                  <h3>Saving this for…?</h3>
                  ${optsFor()}
                  <button class="skip" type="button">Skip</button>
                </div>
              `)}</div>
            </div>
          </div>`,
        },
        {
          t: 5500,
          play: "Four reasons. No price-drop chip. No bookmark. No how-it-looks.",
          html: `<div class="versus">
            <div class="col now">
              <p class="tag">Myntra now</p>
              <h2>One pile, many meanings</h2>
              <p>Office Wear, Summer Wear, Upcoming Sale — folders after the fact. The save itself is silent.</p>
              <div class="stage">${device("/shopper/studio-blazer.jpg", `
                <div class="pdp-body"><div class="brand">Collections</div><div class="pdp-title">Create Collection</div></div>
                <div class="list-row"><img src="/shopper/studio-blazer.jpg" alt="" /><div>Office Wear<br/><span class="muted">4 items</span></div></div>
                <div class="list-row"><img src="/shopper/women-saree.jpg" alt="" /><div>Friend's Wedding<br/><span class="muted">12 items</span></div></div>
                <div class="list-row"><img src="/shopper/genz-hoodie.jpg" alt="" /><div>Upcoming Sale<br/><span class="muted">41 items</span></div></div>
              `)}</div>
            </div>
            <div class="col mvp">
              <p class="tag">This MVP</p>
              <h2>Reason at save</h2>
              <p>🔎 Check quality first · 📦 Check the fit · 🆚 Compare · 🎉 Upcoming Occasion · Skip. That choice becomes a tab. No coupon or price-drop as a save reason.</p>
              <div class="stage">${device("/shopper/women-saree.jpg", `
                ${pdp("Banarasi Silk Saree", "₹4,299", true)}
                <div class="sheet-panel">
                  <div class="handle"></div>
                  <h3>Saving this for…?</h3>
                  ${optsFor()}
                  <button class="skip" type="button">Skip</button>
                </div>
              `)}</div>
            </div>
          </div>`,
        },
        {
          t: 5000,
          play: "The list is tabbed by why you saved — and filtered by category.",
          html: `<div class="versus">
            <div class="col now">
              <p class="tag">Myntra now</p>
              <h2>Collections after the fact</h2>
              <p>Office Wear, Friend's Wedding, Upcoming Sale. You file the pile later. Opening Wishlist still dumps you into 1,364 items.</p>
              <div class="stage">${device("/shopper/women-saree.jpg", `
                <div class="pdp-body"><div class="brand">Wishlist</div><div class="pdp-title">1,364 items</div></div>
                <div class="list-row"><img src="/shopper/studio-blazer.jpg" alt="" /><div>Office Wear<br/><span class="muted">4 items · a folder</span></div></div>
                <div class="list-row"><img src="/shopper/women-saree.jpg" alt="" /><div>Friend's Wedding<br/><span class="muted">12 items · a folder</span></div></div>
              `)}</div>
            </div>
            <div class="col mvp">
              <p class="tag">This MVP</p>
              <h2>Tabs from the save reason</h2>
              <p>All · Compare · Quality &amp; trust · My size · Occasion · No longer available. Men · Women · Kids · Beauty · GenZ switch the list. Categories never mix.</p>
              <div class="stage">${device("/shopper/women-saree.jpg", `
                <div class="pdp-body"><div class="brand">Wishlist</div><div class="pdp-title">Women · tabbed by why you saved</div></div>
                <div class="cat-bar"><span>MEN</span><span class="on">WOMEN</span><span>KIDS</span><span>BEAUTY</span><span>GENZ</span></div>
                <div class="tab-row">
                  <div class="tab-pill">All</div>
                  <div class="tab-pill">Compare</div>
                  <div class="tab-pill on">Quality &amp; trust</div>
                  <div class="tab-pill">My size</div>
                  <div class="tab-pill">Occasion</div>
                  <div class="tab-pill">No longer available</div>
                </div>
                <div class="list-row"><img src="/shopper/studio-dress.png" alt="" /><div>Flared Ethnic Maxi<br/><span class="muted">🔎 Quality &amp; trust · this tab</span></div></div>
                <div class="list-row"><img src="/shopper/women-top.jpg" alt="" /><div>Ruffled Off-Shoulder Mini Dress<br/><span class="muted">🔎 Quality &amp; trust · this tab</span></div></div>
              `)}</div>
            </div>
          </div>`,
        },
        {

      const screen = document.getElementById("screen");
      const fill = document.getElementById("fill");
      const bar = document.getElementById("bar");
      const clock = document.getElementById("clock");
      const playBtn = document.getElementById("play");
      const playingEl = document.getElementById("playing");
      const dotsEl = document.getElementById("dots");
      const tray = screen.querySelector(".ctrl");
      slides.forEach((s, i) => {
        const el = document.createElement("div");
        el.className = "slide" + (i === 0 ? " on" : "");
        el.innerHTML = s.html;
        screen.insertBefore(el, tray);
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "dot" + (i === 0 ? " on" : "");
        dot.title = s.play;
        dot.onclick = () => jump(i);
        dotsEl.appendChild(dot);
      });
      const nodes = [...screen.querySelectorAll(".slide")];
      const dots = [...dotsEl.querySelectorAll(".dot")];
      const total = slides.reduce((n, s) => n + s.t, 0);
      let i = 0;
      let elapsed = 0;
      let playing = true;
      let last = performance.now();

      function fmt(ms) {
        const s = Math.max(0, Math.min(Math.floor(ms / 1000), Math.floor(total / 1000)));
        return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      }
      function starts() {
        const out = [];
        let acc = 0;
        for (const s of slides) {
          out.push(acc);
          acc += s.t;
        }
        return out;
      }
      const startAt = starts();
      function paint() {
        nodes.forEach((el, idx) => el.classList.toggle("on", idx === i));
        dots.forEach((el, idx) => el.classList.toggle("on", idx === i));
        playingEl.textContent = slides[i].play;
        fill.style.width = (elapsed / total) * 100 + "%";
        clock.textContent = fmt(elapsed) + " / " + fmt(total);
      }
      function jump(n) {
        i = Math.max(0, Math.min(n, slides.length - 1));
        elapsed = startAt[i];
        playing = true;
        playBtn.textContent = "Pause";
        last = performance.now();
        paint();
      }
      function tick(now) {
        const dt = now - last;
        last = now;
        if (playing) {
          elapsed += dt;
          if (elapsed >= total) {
            elapsed = total;
            i = slides.length - 1;
            playing = false;
            playBtn.textContent = "Play";
          } else {
            let k = slides.length - 1;
            for (let n = 0; n < slides.length; n++) {
              if (elapsed < startAt[n] + slides[n].t) {
                k = n;
                break;
              }
            }
            i = k;
          }
          paint();
        }
        requestAnimationFrame(tick);
      }
      playBtn.onclick = () => {
        if (elapsed >= total) jump(0);
        else {
          playing = !playing;
          playBtn.textContent = playing ? "Pause" : "Play";
          last = performance.now();
        }
      };
      document.getElementById("restart").onclick = () => jump(0);
      document.getElementById("prev").onclick = () => jump(i - 1);
      bar.onclick = (event) => {
        const rect = bar.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
        const target = ratio * total;
        let n = slides.length - 1;
        for (let k = 0; k < slides.length; k++) {
          if (target < startAt[k] + slides[k].t) {
            n = k;
            break;
          }
        }
        elapsed = target;
        i = n;
        playing = true;
        playBtn.textContent = "Pause";
        last = performance.now();
        paint();
      };
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          playBtn.click();
        }
        if (e.code === "ArrowRight") jump(i + 1);
        if (e.code === "ArrowLeft") jump(i - 1);
      });
      paint();
      requestAnimationFrame(tick);
    </script>
